[workspace]
members = ["crates/pkb-search-core", "crates/pkb-search-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tantivy = { version = "=0.25.0", default-features = false, features = ["mmap", "lz4-compression"] }
