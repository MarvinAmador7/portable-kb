name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Python 3.11 / Linux
            runner: ubuntu-24.04
            python: "3.11"
          - name: Python 3.13 / Linux
            runner: ubuntu-24.04
            python: "3.13"
          - name: Python 3.13 / macOS ARM
            runner: macos-15
            python: "3.13"
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Test with coverage gate
        run: python -m pytest -q --cov=portable_kb --cov-report=term-missing
      - name: Check installer syntax
        run: sh -n install

  package:
    name: Build and inspect Python package
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Build wheel and source distribution
        run: |
          python -m pip install "build>=1.2,<2" "twine>=7,<8"
          python -m build
          python -m twine check dist/*
      - name: Verify bundled runtime data
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("*.whl"))
          with ZipFile(wheel) as archive:
              names = set(archive.namelist())
          required = {
              "portable_kb/schemas/brain.schema.yaml",
              "portable_kb/schemas/bundle-config.schema.yaml",
              "portable_kb/schemas/knowledge-item.schema.yaml",
              "portable_kb/skills/portable-kb/SKILL.md",
          }
          missing = sorted(required - names)
          if missing:
              raise SystemExit(f"wheel is missing bundled data: {missing}")
          PY
      - name: Smoke-test installed wheel
        run: |
          python -m venv "${RUNNER_TEMP}/package-smoke"
          "${RUNNER_TEMP}/package-smoke/bin/pip" install dist/*.whl
          "${RUNNER_TEMP}/package-smoke/bin/pkb" --version
          "${RUNNER_TEMP}/package-smoke/bin/pkb" --help >/dev/null
