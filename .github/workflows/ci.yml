name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Python 3.11 / Linux
            runner: ubuntu-24.04
            python: "3.11"
          - name: Python 3.13 / Linux
            runner: ubuntu-24.04
            python: "3.13"
          - name: Python 3.13 / macOS ARM
            runner: macos-15
            python: "3.13"
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Test with coverage gate
        run: python -m pytest -q --cov=portable_kb --cov-report=term-missing
      - name: Check installer syntax
        run: sh -n install

  package:
    name: Build and inspect Python package
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Build wheel and source distribution
        run: |
          python -m pip install "build>=1.2,<2" "twine>=7,<8"
          python -m build
          python -m twine check dist/*
      - name: Verify bundled runtime data
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("*.whl"))
          with ZipFile(wheel) as archive:
              names = set(archive.namelist())
          required = {
              "portable_kb/schemas/brain.schema.yaml",
              "portable_kb/schemas/bundle-config.schema.yaml",
              "portable_kb/schemas/knowledge-item.schema.yaml",
              "portable_kb/skills/portable-kb/SKILL.md",
          }
          missing = sorted(required - names)
          if missing:
              raise SystemExit(f"wheel is missing bundled data: {missing}")
          PY
      - name: Smoke-test installed wheel
        run: |
          python -m venv "${RUNNER_TEMP}/package-smoke"
          "${RUNNER_TEMP}/package-smoke/bin/pip" install dist/*.whl
          "${RUNNER_TEMP}/package-smoke/bin/pkb" --version
          "${RUNNER_TEMP}/package-smoke/bin/pkb" --help >/dev/null

  search-prototypes:
    name: SQLite / Tantivy / QMD search prototypes
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install benchmark dependencies
        run: |
          python -m pip install -e ".[dev]"
          npm install --global @tobilu/qmd@2.8.3
          rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
      - name: Check and build the Rust prototype
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
          cargo build --release --locked
      - name: Test normalized sections, both engines, and native recovery
        env:
          PKB_TANTIVY_COMMAND: ${{ github.workspace }}/target/release/pkb-search
          PKB_BENCHMARK_REFERENCE_EXPORT: ${{ runner.temp }}/pkb-reference-corpus
        run: python -m pytest -q tests/test_search_records.py tests/test_search_benchmarks.py tests/test_search_recovery.py tests/test_tantivy_provider.py
      - name: Compare shared reference and scale corpora
        run: |
          python -m benchmarks.search run "${RUNNER_TEMP}/pkb-reference-corpus" --output "${RUNNER_TEMP}/pkb-prototype-results/reference" --tantivy target/release/pkb-search --qmd qmd
          python -m benchmarks.search generate --items 1000 --output "${RUNNER_TEMP}/pkb-scale-corpus"
          python -m benchmarks.search run "${RUNNER_TEMP}/pkb-scale-corpus" --output "${RUNNER_TEMP}/pkb-prototype-results/1000" --tantivy target/release/pkb-search --qmd qmd
      - name: Retain provider comparison reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: search-prototype-comparison
          path: ${{ runner.temp }}/pkb-prototype-results/**/report.json
          if-no-files-found: error

  qmd-compatibility:
    name: QMD 2.8.3 compatibility
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install Portable KB and pinned QMD
        run: |
          python -m pip install -e ".[dev]"
          npm install --global @tobilu/qmd@2.8.3
          qmd --version
      - name: Exercise real keyword indexing and retrieval
        env:
          PKB_REAL_QMD: "1"
          PKB_QMD_EVALUATION_REPORT: ${{ runner.temp }}/qmd-evaluation.json
        run: python -m pytest -q tests/test_qmd_integration.py
      - name: Retain labeled QMD baseline report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qmd-evaluation
          path: ${{ runner.temp }}/qmd-evaluation.json
          if-no-files-found: error
