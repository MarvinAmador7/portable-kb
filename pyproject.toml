[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "portable-kb-core"
version = "0.1.0"
description = "Deterministic governance library for a portable OKF-compatible knowledge bundle."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "jsonschema[format]>=4.23,<5",
  "questionary>=2.1,<3",
  "ruamel.yaml>=0.18.10,<0.19",
  "typer>=0.27,<0.28",
]

[project.scripts]
pkb = "portable_kb.cli:app"

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/portable_kb"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "portable_kb/schemas"
".agents/skills/portable-kb" = "portable_kb/skills/portable-kb"

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config -ra"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["portable_kb"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
